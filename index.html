<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-amaliyot</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <div class="top-bar">
    <p>A Webflow template for SaaS products. <a href="#">See all templates &gt;</a></p>
  </div>

  <header class="main-header">
    <div class="header-container">
      <div class="logo-area">
        <a href="#" class="logo">
          <img src="./image/logo.svg" alt="logo" width="106" height="37">
          
        </a>
      </div>
      
      <nav class="nav-links">
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">Integrations</a>
        <a href="#">Learn</a>
      </nav>

      <div class="header-actions">
        <a href="#" class="btn-signin">Sign in</a>
        <a href="#" class="btn-demo">Book a demo</a>

    </div>

  <main class="hero-section">

        <p class="hero-description">
          Whirl lets you design and streamline your everyday tasks and workflows in just a few clicks.
        </p>
        <div class="hero-cta">
          <a href="#" class="btn-demo">Book a demo</a>
          <a href="#" class="btn-learn">Learn more <span class="arrow">&gt;</span></a>
        </div>
      </div>

      <div class="hero-image-wrapper">

          <img src="./image/hero.svg" alt="" width="452" height="422">
        </div>
      </div>

    </div>
